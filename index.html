<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nualē · Portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..700&family=DM+Sans:opsz,wght@9..40,300..600&display=swap" rel="stylesheet">
<style>
/* Layout: site editorial de escritório de arquitetura com páginas (início, portfólio, projeto, sobre, contato). Papel areia, tinta vinho, dourado em detalhes; fotos retas e linhas finas. */
:root{
  --papel:#EFEBE4; --papel2:#E6E0D6; --vinho:#4A1710; --vinho2:#661E16; --vinho3:#36100B;
  --tinta:#2B1815; --apagado:#7A665C; --linha:rgba(74,23,16,.18);
  --ouro:#C4A97A; --creme:#F6EBD6;
  --titulo:'Bricolage Grotesque',system-ui,sans-serif;
  --corpo:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.7,.15,1);
  --g:clamp(20px,4vw,56px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.65 var(--corpo);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--titulo);font-weight:300;letter-spacing:-.03em;margin:0;text-wrap:balance}
p{margin:0}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:1.5px solid var(--vinho2);outline-offset:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pad{padding-inline:var(--g)}
.rot{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:var(--apagado)}
.sub{background-image:linear-gradient(currentColor,currentColor);background-size:0 1px;background-position:0 100%;background-repeat:no-repeat;transition:background-size .5s var(--ease)}
.sub:hover,a:hover .sub,button:hover .sub,.sub.on{background-size:100% 1px}
.seta-link{display:inline-flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--vinho)}
.seta-link .c{width:42px;height:42px;border-radius:50%;border:1px solid var(--linha);display:grid;place-items:center;transition:all .45s var(--ease)}
.seta-link:hover .c{background:var(--vinho);color:var(--creme);border-color:var(--vinho);transform:rotate(-45deg)}

/* CABEÇALHO */
.cab{position:fixed;inset:0 0 auto;z-index:50;display:flex;justify-content:space-between;align-items:center;height:72px;background:var(--vinho);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .4s,height .4s}
.cab.solido{border-color:rgba(232,220,198,.18);height:62px;box-shadow:0 6px 20px -12px rgba(0,0,0,.5)}
.cab .logo{width:112px}
.cab nav{display:flex;gap:clamp(16px,3vw,40px);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.cab nav a{color:#E8DCC6}
.menu-btn{display:none;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:#E8DCC6}
.gaveta{position:fixed;inset:0;z-index:49;background:var(--vinho);color:var(--creme);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:var(--g);transform:translateY(-100%);transition:transform .7s var(--ease)}
.gaveta.on{transform:none}
.gaveta a{font-family:var(--titulo);font-weight:300;font-size:clamp(40px,11vw,64px);letter-spacing:-.03em;line-height:1.1}
.gaveta a span{font-family:var(--corpo);font-size:12px;color:var(--ouro);letter-spacing:.2em;margin-right:14px;vertical-align:middle}
.gaveta .zaps{margin-top:36px;display:grid;gap:4px;font-size:15px;color:var(--ouro)}
@media (max-width:720px){.cab nav{display:none}.menu-btn{display:block}}

/* TRANSIÇÃO DE PÁGINA */
#app{min-height:100vh;padding-top:72px}
.pagina{animation:entra .9s var(--ease) both}
@keyframes entra{from{opacity:0;transform:translateY(24px)}}
.cortina{position:fixed;inset:0;z-index:80;background:var(--vinho);transform:translateY(100%);pointer-events:none;display:grid;place-items:center;visibility:hidden}
.cortina.cobre,.cortina.sai{visibility:visible}
.cortina img{width:120px;opacity:0;transition:opacity .2s}
.cortina.cobre{transition:transform .5s var(--ease);transform:none}
.cortina.cobre img{opacity:1}
.cortina.sai{transition:transform .6s var(--ease);transform:translateY(-100%)}

/* ===== INÍCIO ===== */
.case-hero{position:relative;padding-top:clamp(28px,4vw,48px)}
.case-hero .topo{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--g);align-items:end;margin-bottom:clamp(24px,3vw,40px)}
.case-hero h1{font-size:clamp(44px,7vw,112px);line-height:.95;color:var(--vinho)}
.case-hero h1 span{display:block;overflow:hidden}
.case-hero h1 span i{display:block;font-style:normal;animation:linha 1.2s var(--ease) both}
.case-hero h1 span:nth-child(2) i{animation-delay:.08s}
@keyframes linha{from{transform:translateY(105%)}}
.case-hero .lado{display:grid;gap:22px;justify-items:start}
.case-hero .lado p{color:var(--apagado);max-width:42ch}
.case-img{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:clamp(10px,1.4vw,18px);height:min(78vh,760px)}
.case-img a{position:relative;overflow:hidden;background:var(--papel2)}
.case-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease)}
.case-img a:hover img{transform:scale(1.04)}
.case-img a:nth-child(2){margin-top:12%}
.case-img a:nth-child(3){margin-bottom:12%}
.selo-case{position:absolute;left:16px;top:16px;background:var(--vinho);color:var(--creme);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;padding:8px 12px}
@media (max-width:820px){.case-hero .topo{grid-template-columns:1fr}.case-img{grid-template-columns:1fr 1fr;height:auto}.case-img a:first-child{grid-column:span 2;aspect-ratio:4/5}.case-img a{aspect-ratio:4/5;margin:0!important}}

.intro{display:grid;grid-template-columns:1fr;gap:clamp(18px,2.4vw,28px);padding-block:clamp(80px,11vw,160px)}
.intro p.grande{font-family:var(--titulo);font-weight:300;font-size:clamp(26px,3.3vw,46px);line-height:1.18;letter-spacing:-.02em;color:var(--vinho)}
.intro p.grande em{font-style:italic;font-weight:600;color:var(--vinho);font-synthesis:style}
.intro .acoes{margin-top:36px}
@media (max-width:820px){.intro{grid-template-columns:1fr}}

.secao-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(24px,3vw,40px);border-top:1px solid var(--vinho);padding-top:18px}
.secao-topo h2{font-size:clamp(34px,4.6vw,64px);line-height:1;color:var(--vinho)}

/* cards de projeto */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px) clamp(12px,1.6vw,22px)}
.card{display:grid;gap:14px;align-content:start}
.card .im{position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--papel2)}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease),opacity .8s}
.card .im img.b{opacity:0}
.card:hover .im img.a{transform:scale(1.05)}
.card:hover .im img.b{opacity:1;transform:scale(1.05)}
.card .info{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:1px solid var(--linha);padding-top:12px}
.card h3{font-size:clamp(20px,1.9vw,26px);color:var(--vinho);line-height:1.1}
.card .meta{font-size:13px;color:var(--apagado);white-space:nowrap}
.card.breve{cursor:default}
.card.breve .im{display:grid;place-items:center;background:var(--papel2)}
.card.breve .im span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--apagado);border:1px solid var(--linha);padding:10px 14px}
.card.breve h3{color:var(--apagado)}
@media (max-width:900px){.cards{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}

.faixa-cta{margin-top:clamp(90px,12vw,170px);background:var(--vinho);color:var(--creme);padding-block:clamp(56px,8vw,110px);display:grid;grid-template-columns:1.4fr 1fr;gap:var(--g);align-items:end}
.faixa-cta h2{font-size:clamp(38px,5.6vw,84px);line-height:.95}
.faixa-cta h2 em{font-style:normal;color:var(--ouro)}
.faixa-cta .seta-link{color:var(--creme);justify-self:end}
.faixa-cta .seta-link .c{border-color:rgba(196,169,122,.6);color:var(--ouro)}
.faixa-cta .seta-link:hover .c{background:var(--ouro);color:var(--vinho)}
@media (max-width:820px){.faixa-cta{grid-template-columns:1fr}.faixa-cta .seta-link{justify-self:start}}


/* ===== INÍCIO: colagem ===== */
.colagem{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(60px,7.4vw,108px);gap:clamp(8px,1.2vw,16px);padding-block:clamp(24px,3vw,40px) clamp(60px,8vw,110px)}
.tile{position:relative;overflow:hidden;background:var(--papel2)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.8s var(--ease)}
.tile img.novo{opacity:0;transform:scale(1.06);transition:opacity 1.4s ease,transform 2.4s var(--ease)}
.tile img.novo.on{opacity:1;transform:none}
.tile:hover img{transform:scale(1.04)}
.home-topo{display:grid;grid-template-columns:1fr;gap:clamp(18px,2.4vw,28px);align-items:start;padding-top:clamp(32px,5vw,72px);padding-bottom:clamp(8px,1vw,12px)}
.home-topo h1{font-size:clamp(18px,5.6vw,96px);white-space:nowrap;line-height:1;color:var(--vinho);margin-top:22px}
.home-topo h1 span{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.home-topo h1 span i{display:inline-block;font-style:normal;animation:linha 1.2s var(--ease) both}
.home-topo h1 span:nth-child(2) i{animation-delay:.1s}
.ht-lado{display:grid;gap:22px;justify-items:start}
.ht-lado p{color:var(--apagado);max-width:40ch}
.colagem{padding-block:clamp(24px,3vw,40px) 0}
.t0{grid-column:1 / span 6;grid-row:1 / span 6}
.t1{grid-column:7 / span 3;grid-row:1 / span 4}
.t2{grid-column:10 / span 3;grid-row:2 / span 4}
.t3{grid-column:7 / span 3;grid-row:5 / span 3}
.t4{grid-column:10 / span 3;grid-row:6 / span 2}
@media (max-width:820px){.home-topo{grid-template-columns:1fr}}
@media (max-width:760px){
  .colagem{grid-template-columns:repeat(6,1fr);grid-auto-rows:16vw}
  .t0{grid-column:1 / span 6;grid-row:1 / span 6}
  .t1{grid-column:1 / span 3;grid-row:7 / span 4}
  .t2{grid-column:4 / span 3;grid-row:7 / span 5}
  .t3{grid-column:1 / span 3;grid-row:11 / span 4}
  .t4{grid-column:4 / span 3;grid-row:12 / span 3}
}

/* ===== DIFERENCIAL ===== */
.dif{display:grid;grid-template-columns:1.15fr .85fr;gap:var(--g);align-items:center;background:var(--vinho);color:var(--creme);padding-block:clamp(70px,9vw,130px);margin-block:clamp(40px,6vw,80px)}
.dif .rot{color:var(--ouro)}
.dif h2{font-size:clamp(34px,4.6vw,64px);line-height:1;margin-top:14px;color:var(--creme)}
.dif h2 em{font-style:normal;color:var(--ouro)}
.dif-lead{color:#DCCFC2;margin-top:20px;max-width:48ch;font-size:clamp(16px,1.5vw,18px)}
.dif-lista{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 var(--g);border-top:1px solid rgba(196,169,122,.4)}
.dif-lista li{padding:16px 0;border-bottom:1px solid rgba(196,169,122,.25);display:grid;gap:4px}
.dif-lista b{font-family:var(--titulo);font-weight:400;font-size:19px;color:var(--creme)}
.dif-lista span{font-size:14.5px;color:#CDBFAE}
.cel-wrap{display:grid;place-items:center}
.cel{width:min(300px,78vw);aspect-ratio:9/18.5;border-radius:42px;background:#1E0906;padding:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6),inset 0 0 0 1.5px rgba(196,169,122,.4)}
.cel-tela{position:relative;height:100%;border-radius:32px;background:var(--papel);overflow:hidden;color:var(--tinta);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.cel-top{display:flex;justify-content:space-between;align-items:center;background:var(--vinho);margin:-20px -16px 0;padding:26px 16px 14px}
.cel-top img{width:62px}
.cel-top span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ouro)}
.cel-card{background:#fff;border-radius:14px;padding:14px;display:grid;gap:6px;box-shadow:0 6px 18px -10px rgba(43,24,21,.3)}
.cel-card small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--apagado)}
.cel-card b{font-family:var(--titulo);font-weight:500;font-size:17px;color:var(--vinho)}
.cel-prog{height:6px;border-radius:6px;background:var(--papel2);overflow:hidden;margin-top:4px}
.cel-prog i{display:block;height:100%;width:0;background:var(--ouro);border-radius:6px}
.cel-pct{display:flex;gap:6px;align-items:baseline;font-size:11px;color:var(--apagado)}
.cel-pct span:first-child{font-family:var(--titulo);font-size:20px;color:var(--vinho);font-variant-numeric:tabular-nums}
.cel-etapas{list-style:none;margin:0;padding:0;display:grid;gap:0}
.cel-etapas li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linha);font-size:12.5px}
.cel-etapas li i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--linha)}
.cel-etapas li.ok i{background:var(--vinho2);border-color:var(--vinho2)}
.cel-etapas li.ag i{border-color:var(--ouro);background:var(--ouro);animation:pulsa 1.6s infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 5px rgba(196,169,122,.25)}}
.cel-etapas em{font-style:normal;font-size:10px;color:var(--apagado)}
.cel-etapas li.ag em{color:var(--vinho2);font-weight:600}
.cel-aviso{position:absolute;left:12px;right:12px;bottom:16px;background:var(--vinho);color:var(--creme);border-radius:14px;padding:12px 14px;display:grid;gap:2px;font-size:12px;transform:translateY(140%);transition:transform .7s var(--ease)}
.cel-aviso b{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ouro);font-weight:600}
.cel-aviso.on{transform:none}
@media (max-width:860px){.dif{grid-template-columns:1fr}.dif-lista{grid-template-columns:1fr}}
.igs{margin-top:clamp(36px,5vw,60px);display:grid;grid-template-columns:1fr 2fr;gap:var(--g);align-items:start}
.ig-lista{display:grid;border-top:1px solid rgba(196,169,122,.5)}
.ig-lista a{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid rgba(196,169,122,.3);font-family:var(--titulo);font-weight:300;font-size:clamp(20px,2.4vw,30px);color:var(--creme);transition:padding .5s var(--ease),color .3s}
.ig-lista a:hover{padding-left:12px;color:var(--ouro)}
.ig-rod{text-transform:none;letter-spacing:.04em;font-size:13px;color:var(--ouro)}
.ig-rod:hover{color:var(--creme)}
@media (max-width:820px){.igs{grid-template-columns:1fr}}
.posic{padding-block:clamp(70px,9vw,130px) 0;display:grid;gap:clamp(18px,2.4vw,28px)}
.posic-grande{font-family:var(--titulo);font-weight:300;font-size:clamp(20px,5.6vw,68px);line-height:1.08;letter-spacing:-.025em;color:var(--vinho);text-wrap:pretty}
.posic-grande span{display:block}
.posic-grande em{font-style:italic;font-weight:600;color:inherit;font-synthesis:style}
.posic-cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--g);border-top:1px solid var(--linha);padding-top:22px;margin-top:10px}
.posic-cols p{color:var(--apagado)}
@media (max-width:760px){.posic-cols{grid-template-columns:1fr;gap:16px}}
/* ===== PORTFÓLIO ===== */
.cab-pag{padding-top:clamp(40px,6vw,90px);padding-bottom:clamp(32px,4vw,56px);display:grid;gap:clamp(14px,2vw,22px)}
.cab-pag h1{font-size:clamp(56px,10vw,160px);line-height:.88;color:var(--vinho)}
.cab-pag p{color:var(--apagado);max-width:52ch;font-size:clamp(16px,1.5vw,19px)}
@media (max-width:820px){.cab-pag{grid-template-columns:1fr}}
.filtros{display:flex;gap:clamp(16px,2.6vw,32px);flex-wrap:wrap;border-top:1px solid var(--vinho);padding:16px 0 clamp(28px,4vw,48px);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.filtros button{color:var(--apagado)}
.filtros button[aria-pressed="true"]{color:var(--vinho)}
.filtros sup{font-size:9px;margin-left:3px}

/* ===== PROJETO ===== */
.voltar{display:inline-flex;gap:10px;align-items:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--vinho);margin-top:clamp(28px,4vw,48px)}
.proj-topo{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--g);align-items:end;padding-block:clamp(28px,4vw,48px) clamp(28px,4vw,48px)}
.proj-topo h1{font-size:clamp(46px,7.4vw,118px);line-height:.92;color:var(--vinho)}
.ficha{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--vinho)}
.ficha div{padding:12px 0;border-bottom:1px solid var(--linha)}
.ficha div:nth-child(odd){padding-right:16px}
.ficha span{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--apagado)}
.ficha b{font-weight:500;color:var(--vinho);font-size:15px}
@media (max-width:820px){.proj-topo{grid-template-columns:1fr}}
.proj-capa{position:relative;overflow:hidden;height:min(86vh,860px);background:var(--papel2)}
.proj-capa img{width:100%;height:100%;object-fit:cover;object-position:center 60%}
@media (max-width:820px){.proj-capa{height:auto;aspect-ratio:4/5}}
.texto-proj{display:grid;grid-template-columns:1fr 2fr;gap:var(--g);padding-block:clamp(70px,9vw,130px)}
.texto-proj .corpo{display:grid;gap:22px}
.texto-proj .lead{font-family:var(--titulo);font-weight:300;font-size:clamp(24px,2.8vw,38px);line-height:1.2;color:var(--vinho);letter-spacing:-.02em}
.texto-proj p{color:var(--apagado);max-width:62ch}
.feito{display:grid;grid-template-columns:1fr 1fr;gap:0 var(--g);margin-top:12px;border-top:1px solid var(--linha)}
.feito div{padding:14px 0;border-bottom:1px solid var(--linha);display:grid;grid-template-columns:34px 1fr;gap:8px;font-size:15px}
.feito b{font-family:var(--titulo);font-weight:400;color:var(--ouro)}
@media (max-width:820px){.texto-proj{grid-template-columns:1fr}.feito{grid-template-columns:1fr}}
.versoes{display:flex;gap:24px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.versoes button{color:var(--apagado);padding-bottom:6px;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.versoes button[aria-pressed="true"]{color:var(--vinho);border-color:var(--vinho)}
.grade{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(10px,1.4vw,20px)}
.fig{position:relative;overflow:hidden;background:var(--papel2);cursor:zoom-in;margin:0}
.fig img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease)}
.fig:hover img{transform:scale(1.04)}
.fig figcaption{position:absolute;left:14px;bottom:12px;color:var(--creme);font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:0;transform:translateY(6px);transition:all .5s var(--ease);text-shadow:0 1px 8px rgba(0,0,0,.4)}
.fig:hover figcaption{opacity:1;transform:none}
.fig.s0{grid-column:1 / span 7;aspect-ratio:4/5}
.fig.s1{grid-column:8 / span 5;aspect-ratio:4/5;margin-top:22%}
.fig.s2{grid-column:2 / span 5;aspect-ratio:4/5}
.fig.s3{grid-column:7 / span 6;aspect-ratio:4/5;margin-top:-14%}
.fig.s4{grid-column:1 / span 4;aspect-ratio:4/5}

function ligaDif(){
  const bar=app.querySelector('#celBar'), pct=app.querySelector('#celPct'), av=app.querySelector('#celAviso'); if(!bar)return;
  const alvo=58;
  const roda=()=>{ if(reduz){bar.style.width=alvo+'%';pct.textContent=alvo+'%';av.classList.add('on');return;}
    const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1600);const v=Math.round(alvo*(1-Math.pow(1-k,3)));bar.style.width=v+'%';pct.textContent=v+'%';if(k<1)requestAnimationFrame(f);else setTimeout(()=>av.classList.add('on'),400);})(t0);};
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){io.disconnect();roda();}},{threshold:.35}); io.observe(app.querySelector('.cel'));
}

    </div>

      ${p.texto.map(t=>`<p>${t}</p>`).join('')}
      <div class="feito">${p.feito.map((f,i)=>`<div><b>${String(i+1).padStart(2,'0')}</b><span>${f}</span></div>`).join('')}</div>

    <div class="secao-topo"><h2>Imagens</h2>${nv.length>1?`<div class="versoes" role="group" aria-label="Versão">${nv.map((v,i)=>`<button type="button" data-v="${v}" aria-pressed="${i===0}">${v}</button>`).join('')}</div>`:''}</div>
    <div class="grade" id="grade"></div>

}
function montaGrade(){
  const g=document.getElementById('grade'); if(!g)return; const fotos=projAtual.versoes[versaoAtual];
  g.innerHTML=fotos.slice(0,7).map((f,i)=>`<figure class="fig s${i}" tabindex="0" role="button" aria-label="Ampliar imagem ${i+1}" data-i="${i}"><img src="img/${f}.jpg" alt="${projAtual.nome}, imagem ${i+1}"><figcaption>${String(i+1).padStart(2,'0')}${Object.keys(projAtual.versoes).length>1?' · '+versaoAtual:''}</figcaption></figure>`).join('')
   + (fotos.length>7?`<div style="grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:12px"><button class="seta-link" id="verTodas" type="button"><span class="sub">Ver as ${fotos.length} imagens</span> ${seta}</button></div>`:'');
  g.querySelectorAll('.fig').forEach(fg=>{const ab=()=>abrir(+fg.dataset.i);fg.onclick=ab;fg.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ab();}};});
  const vt=document.getElementById('verTodas'); if(vt) vt.onclick=()=>abrir(0);
}
function ligaProjeto(){
  montaGrade();
  app.querySelectorAll('.versoes button').forEach(b=>b.onclick=()=>{
    if(b.dataset.v===versaoAtual)return; versaoAtual=b.dataset.v;
    app.querySelectorAll('.versoes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const g=document.getElementById('grade');
    if(reduz||!g.animate){montaGrade();return;}
    g.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}).onfinish=()=>{montaGrade();g.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:600,easing:'cubic-bezier(.22,.7,.15,1)',fill:'forwards'});};
  });
}

/* ---------- ROTEADOR ---------- */
const ROTAS={inicio:[pgInicio,()=>{ligaInicio();ligaDif();}],portfolio:[pgPortfolio,ligaPortfolio],sobre:[pgSobre,ligaDif],contato:[pgContato,ligaContato]};
let primeira=true;
function render(){
  const h=(location.hash||'#inicio').slice(1);
  let html,liga,chave=h;
  if(h.startsWith('projeto-')){html=pgProjeto(h.slice(8));liga=ligaProjeto;chave='portfolio';}
  else{const r=ROTAS[h]||ROTAS.inicio;html=r[0]();liga=r[1];chave=ROTAS[h]?h:'inicio';}
  const troca=()=>{
    app.innerHTML=html; liga&&liga(); window.scrollTo(0,0);
    document.querySelectorAll('#navPrin a').forEach(a=>a.classList.toggle('on',a.dataset.r===chave));
    document.title=h.startsWith('projeto-')?`${(projAtual||{}).nome||'Projeto'} · Nualē`:({inicio:'Nualē · Arquitetura & Interiores',portfolio:'Portfólio · Nualē',sobre:'Sobre · Nualē',contato:'Contato · Nualē'})[chave];
    revela(); if(!primeira) app.focus({preventScroll:true});
  };
  fechaGaveta();
  if(primeira||reduz){troca();primeira=false;return;}
  const c=document.getElementById('cortina');
  c.classList.remove('sai'); c.classList.add('cobre');
  setTimeout(()=>{troca();c.classList.remove('cobre');c.classList.add('sai');setTimeout(()=>c.classList.remove('sai'),650);},520);
}
addEventListener('hashchange',render);

/* revelação das imagens ao rolar */
let io=null;
function revela(){
  if(reduz||!('animate' in Element.prototype))return;
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.animate([{clipPath:'inset(10% 0 0 0)',transform:'translateY(28px)'},{clipPath:'inset(0 0 0 0)',transform:'none'}],{duration:1100,easing:'cubic-bezier(.22,.7,.15,1)'});io.unobserve(e.target);}}),{threshold:.08});
  app.querySelectorAll('.card .im,.fig,.sobre-hero .img,.proj-capa').forEach(el=>{if(el.getBoundingClientRect().top>innerHeight)io.observe(el);});
}
new MutationObserver(()=>revela()).observe(app,{childList:true,subtree:false});

/* cabeçalho, menu */
const cab=document.getElementById('cab'), gav=document.getElementById('gaveta'), mb=document.getElementById('menuBtn');
addEventListener('scroll',()=>cab.classList.toggle('solido',scrollY>30),{passive:true});
function fechaGaveta(){gav.classList.remove('on');mb.setAttribute('aria-expanded',false);mb.textContent='Menu';}
mb.onclick=()=>{const on=gav.classList.toggle('on');mb.setAttribute('aria-expanded',on);mb.textContent=on?'Fechar':'Menu';};

/* visualizador */
const vis=document.getElementById('vis'), tr=document.getElementById('visTrilho'), ct=document.getElementById('visC');
let foco=null;
function abrir(i){
  foco=document.activeElement; const l=projAtual.versoes[versaoAtual];
  document.getElementById('visT').textContent=projAtual.nome; document.getElementById('visS').textContent=Object.keys(projAtual.versoes).length>1?'Versão '+versaoAtual.toLowerCase():projAtual.tipo;
  tr.innerHTML=l.map((f,k)=>`<div class="slide"><img src="img/${f}.jpg" alt="${projAtual.nome}, imagem ${k+1}"></div>`).join('');
  vis.classList.add('open'); document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{tr.scrollLeft=i*tr.clientWidth;conta();}); document.getElementById('visX').focus();
}
function fechar(){vis.classList.remove('open');document.body.style.overflow='';foco&&foco.focus();}
function conta(){if(!projAtual)return;const n=projAtual.versoes[versaoAtual].length;const i=Math.round(tr.scrollLeft/tr.clientWidth);ct.textContent=`${String(i+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}`;}
const vai=d=>tr.scrollBy({left:d*tr.clientWidth,behavior:reduz?'auto':'smooth'});
tr.addEventListener('scroll',conta,{passive:true});
document.getElementById('visX').onclick=fechar;
document.getElementById('visA').onclick=()=>vai(-1); document.getElementById('visP').onclick=()=>vai(1);
addEventListener('keydown',e=>{if(e.key==='Escape'&&gav.classList.contains('on'))fechaGaveta();if(!vis.classList.contains('open'))return;if(e.key==='Escape')fechar();if(e.key==='ArrowLeft')vai(-1);if(e.key==='ArrowRight')vai(1);});


document.getElementById('wppFlut').href=`https://wa.me/5524992662596?text=${encodeURIComponent("Olá, Anna! Vim pelo site da Nualē e gostaria de saber mais sobre um projeto.")}`;
render();
</script>
